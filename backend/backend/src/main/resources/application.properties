spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/lost_found_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.directory=${UPLOAD_DIRECTORY:uploads}
app.upload.public-url-base=${APP_UPLOAD_PUBLIC_URL_BASE:http://localhost:8080/uploads}
app.upload.max-file-size=5242880

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000
